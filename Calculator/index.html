<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form>
                <div class="display">
                    <input type="text" name="display" id="display">
                </div>
                <div class="button">
                    <input type="button" class="operator" value="AC" onclick="clearDisplay()">
                    <input type="button" class="operator" value="DE" onclick="deleteLast()">
                    <input type="button" class="operator" value="." onclick="appendValue('.')">
                    <input type="button" class="operator" value="/" onclick="appendValue('/')">
                
                
                    <input type="button" value="7" onclick="appendValue('7')">
                    <input type="button" value="8" onclick="appendValue('8')">
                    <input type="button" value="9" onclick="appendValue('9')">
                    <input type="button" value="*" onclick="appendValue('*')" class="operator">
                
                
                    <input type="button" value="4" onclick="appendValue('4')">
                    <input type="button" value="5" onclick="appendValue('5')">
                    <input type="button" value="6" onclick="appendValue('6')">
                    <input type="button" value="-" onclick="appendValue('-')" class="operator">
                
                
                    <input type="button" value="1" onclick="appendValue('1')">
                    <input type="button" value="2" onclick="appendValue('2')">
                    <input type="button" value="3" onclick="appendValue('3')">
                    <input type="button" value="+" onclick="appendValue('+')" class="operator">
                    <input type="button" value=")" onclick="appendValue(')')" class="operator">
                
                
                    <input type="button" value="^" onclick="appendValue('^')" class="mu operator">
                    <input type="button" value="00" onclick="appendValue('00')">
                    <input type="button" value="0" onclick="appendValue('0')">
                    <input type="button" value="=" onclick="calculate('=')" class="equal operator">
                    <input type="button" value="√" onclick="appendValue('sqrt(')" class="sqrt operator">
                </div>
            </form>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        let lichsu =[];
        function clearDisplay(){
            display.value ='';
            lichsu = [];
        }
        function deleteLast(){
            lichsu.pop();
            display.value = lichsu.map(item => item.value).join('');
        }
        function appendValue(value){
            display.value +=value;
            lichsu.push({value: value});
        }
        function calculate(){
            try{
                    lichsu = [];
            }catch(e){
                display.value = 'error';
            }
        }
        function tokenize(input){
            return input.match(/\d+\.?\d*|[a-z]+|[-+/*^]|[()]/g);
        }
        function shuntingYard(token){
            let output = [];
            let operatorStack = [];
            const precedence = {
                '+':1,
                '-':1,
                '/':2,
                '*':2,
                '^':3};
                const rightAssociative = { '^': true };
                for (let i =0; i < token.length; i++){
                let t = token[i];
                if (/\d+\.?\d*/.test(t)){
                    output.push(t);
                } else if (/[a-z]+/.test(t)){
                    operatorStack.push(t);
                } else if(t ==="("){
                    operatorStack.push(t);
                } else if (t ===")"){
                    while (operatorStack[operatorStack.length - 1] !=="("){
                        let op = operatorStack.pop();
                        output.push(op);
                    }
                    operatorStack.pop();
                } else if (/[-+/*^]/.test(t)){
                    while(operatorStack.length > 0 && operatorStack[operatorStack.length - 1] !=="(" && (rightAssociative[t] 
                             ? precedence[operatorStack[operatorStack.length - 1]] > precedence[t]
                             : precedence[operatorStack[operatorStack.length - 1]] >= precedence[t])
                        ){
                        output.push(operatorStack.pop());
                    }
                    operatorStack.push(t);
                } 
            }
                while(operatorStack.length > 0){
                    output.push(operatorStack.pop());
                }
                return output;
        }
    </script>
</body>
</html>
