<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form>
                <div class="display">
                    <input type="text" name="display" id="display">
                </div>
                <div class="button">
                    <input type="button" class="operator" value="AC" onclick="clearDisplay()">
                    <input type="button" class="operator" value="DE" onclick="deleteLast()">
                    <input type="button" class="operator" value="." onclick="appendValue('.')">
                    <input type="button" class="operator" value="/" onclick="appendValue('/')">
                
                
                    <input type="button" value="7" onclick="appendValue('7')">
                    <input type="button" value="8" onclick="appendValue('8')">
                    <input type="button" value="9" onclick="appendValue('9')">
                    <input type="button" value="*" onclick="appendValue('*')" class="operator">
                
                
                    <input type="button" value="4" onclick="appendValue('4')">
                    <input type="button" value="5" onclick="appendValue('5')">
                    <input type="button" value="6" onclick="appendValue('6')">
                    <input type="button" value="-" onclick="appendValue('-')" class="operator">
                
                
                    <input type="button" value="1" onclick="appendValue('1')">
                    <input type="button" value="2" onclick="appendValue('2')">
                    <input type="button" value="3" onclick="appendValue('3')">
                    <input type="button" value="+" onclick="appendValue('+')" class="operator">
                    <input type="button" value=")" onclick="appendValue(')')" class="operator">
                
                
                    <input type="button" value="^" onclick="appendValue('^', '**')" class="mu operator">
                    <input type="button" value="00" onclick="appendValue('00')">
                    <input type="button" value="0" onclick="appendValue('0')">
                    <input type="button" value="=" onclick="calculate('=')" class="equal operator">
                    <input type="button" value="√" onclick="appendValue('√(' ,'Math.sqrt(')" class="sqrt operator">
                </div>
            </form>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        let expression = "";
        let lichsu =[];
        function clearDisplay(){
            display.value ='';
            expression ='';
            lichsu = [];
        }
        function deleteLast(){
            lichsu.pop();
            display.value = lichsu.map(item => item.value).join('');
            expression = lichsu.map(item => item.extraValue).join('');
        }
        function appendValue(value, extraValue){
            display.value +=value;
            lichsu.push({value: value, extraValue: extraValue || value});
            expression += extraValue || value;
        }
        function calculate(){
            try{
                display.value = eval(expression);
                    expression = '';
                    lichsu = [];
            }catch(e){
                display.value = 'error';
            }
        }
    </script>
</body>
</html>
