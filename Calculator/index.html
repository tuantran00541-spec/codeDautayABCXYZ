<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form>
                <div class="display">
                    <input type="text" name="display" id="display">
                </div>
              <div class="button">
                <!-- Hàng 1: Chức năng -->
                <input type="button" class="operator" value="AC" onclick="clearDisplay()">
                <input type="button" class="operator" value="DE" onclick="deleteLast()">
                <input type="button" value="(" onclick="appendValue('(')" class="operator">
                <input type="button" value=")" onclick="appendValue(')')" class="operator">

                <!-- Hàng 2 -->
                <input type="button" value="7" onclick="appendValue('7')">
                <input type="button" value="8" onclick="appendValue('8')">
                <input type="button" value="9" onclick="appendValue('9')">
                <input type="button" value="/" onclick="appendValue('/')" class="operator">

                <!-- Hàng 3 -->
                <input type="button" value="4" onclick="appendValue('4')">
                <input type="button" value="5" onclick="appendValue('5')">
                <input type="button" value="6" onclick="appendValue('6')">
                <input type="button" value="*" onclick="appendValue('*')" class="operator">

                <!-- Hàng 4 -->
                <input type="button" value="1" onclick="appendValue('1')">
                <input type="button" value="2" onclick="appendValue('2')">
                <input type="button" value="3" onclick="appendValue('3')">
                <input type="button" value="-" onclick="appendValue('-')" class="operator">

                <!-- Hàng 5 -->
                <input type="button" value="0" onclick="appendValue('0')">
                <input type="button" value="00" onclick="appendValue('00')">
                <input type="button" class="operator" value="." onclick="appendValue('.')">
                <input type="button" value="+" onclick="appendValue('+')" class="operator">

                <!-- Hàng 6 -->
                <input type="button" value="^" onclick="appendValue('^')" class="mu operator">
                <input type="button" value="√" onclick="appendValue('sqrt(')" class="sqrt operator">
                <input type="button" value="x²" onclick="appendValue('sq(')" class="sqrt operator">
                <input type="button" value="x³" onclick="appendValue('cb(')" class="sqrt operator">

                <!-- Hàng 7 -->
                <input type="button" value="sin" onclick="appendValue('sin(')" class="sqrt operator">
                <input type="button" value="cos" onclick="appendValue('cos(')" class="sqrt operator">
                <input type="button" value="tan" onclick="appendValue('tan(')" class="sqrt operator">
                <input type="button" value="1/x" onclick="appendValue('inv(')" class="sqrt operator">

                <!-- Hàng 8 -->
                <input type="button" value="log" onclick="appendValue('log(')" class="sqrt operator">
                <input type="button" value="ln" onclick="appendValue('ln(')" class="sqrt operator">
                <input type="button" value="π" onclick="appendValue('pi')" class="sqrt operator">
                <input type="button" value="e" onclick="appendValue('e')" class="sqrt operator">

                <!-- Hàng 9 -->
                <input type="button" value="!" onclick="appendValue('!')" class="sqrt operator">
                <input type="button" value="|x|" onclick="appendValue('abs(')" class="sqrt operator">
                <input type="button" value="%" onclick="percent('%')" class="sqrt operator">
                <input type="button" value="ans" onclick="appendAns()" class="sqrt operator">
                <input type="button" value="=" onclick="calculate('=')" class="equal operator">
            </div>

            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
