<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header id="site-header">
    <div id="wordmark">
      <span class="wordmark-mark">✛</span>
      <span class="wordmark-text">MANGA<span class="wordmark-accent">TRANSLATOR</span></span>
    </div>
    <span id="wordmark-tag">bàn biên tập &middot; local</span>
  </header>

  <div id="chapter-input">
    <input type="text" id="chapter-url" placeholder="Dán link chapter">
    <select id="lang-select">
      <option value="ja">Nhật</option>
      <option value="ch">Trung</option>
      <option value="korean">Hàn</option>
      <option value="en">Anh</option>
    </select>
    <button id="load-btn">Tải chapter</button>
  </div>

  <div id="page-view"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
